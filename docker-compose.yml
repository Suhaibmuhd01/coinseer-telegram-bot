services:
  db:
    image: postgres:16-alpine
    container_name: coinseer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coinseer_user
      POSTGRES_PASSWORD: coinseer_secret_pass
      POSTGRES_DB: coinseer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinseer_user -d coinseer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coinseer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coinseer_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coinseer_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.services.scheduler.WorkerSettings"]

volumes:
  postgres_data:
  redis_data:
